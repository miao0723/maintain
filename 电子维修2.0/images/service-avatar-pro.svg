<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="svcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6e85a5"/>
      <stop offset="55%" stop-color="#5a6e8a"/>
      <stop offset="100%" stop-color="#4a5c76"/>
    </linearGradient>
    <linearGradient id="svcHeadset" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dfe7f2"/>
    </linearGradient>
    <radialGradient id="svcGloss" cx="35%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="svcClip">
      <circle cx="60" cy="60" r="58"/>
    </clipPath>
  </defs>

  <!-- 圆形背景 -->
  <circle cx="60" cy="60" r="58" fill="url(#svcBg)"/>

  <g clip-path="url(#svcClip)">
    <!-- 顶部高光 -->
    <circle cx="60" cy="60" r="58" fill="url(#svcGloss)"/>

    <!-- 肩部/身体 -->
    <path d="M18 120 Q18 86 60 86 Q102 86 102 120 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M60 86 Q78 86 88 98 L88 120 L32 120 L32 98 Q42 86 60 86 Z" fill="#eef2f8"/>

    <!-- 头部 -->
    <circle cx="60" cy="52" r="24" fill="#fce4cf"/>
    <!-- 头发 -->
    <path d="M36 50 Q36 26 60 26 Q84 26 84 50 Q84 42 76 39 Q70 34 60 34 Q50 34 44 39 Q36 42 36 50 Z" fill="#3f4a5c"/>

    <!-- 眼睛 -->
    <ellipse cx="51" cy="52" rx="2.8" ry="3.6" fill="#3a4353"/>
    <ellipse cx="69" cy="52" rx="2.8" ry="3.6" fill="#3a4353"/>
    <circle cx="52" cy="50.6" r="1" fill="#ffffff"/>
    <circle cx="70" cy="50.6" r="1" fill="#ffffff"/>

    <!-- 微笑 -->
    <path d="M53 61 Q60 67 67 61" stroke="#e08b6a" stroke-width="2.4" fill="none" stroke-linecap="round"/>

    <!-- 耳麦头梁 -->
    <path d="M33 54 Q33 24 60 24 Q87 24 87 54" fill="none" stroke="url(#svcHeadset)" stroke-width="6" stroke-linecap="round"/>
    <!-- 左耳罩 -->
    <rect x="27" y="50" width="12" height="20" rx="6" fill="url(#svcHeadset)"/>
    <!-- 右耳罩 -->
    <rect x="81" y="50" width="12" height="20" rx="6" fill="url(#svcHeadset)"/>
    <!-- 麦克风臂 -->
    <path d="M33 68 Q33 82 50 82" fill="none" stroke="url(#svcHeadset)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="52" cy="82" r="4" fill="#6e85a5"/>
  </g>

  <!-- 细描边圈 -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>
</svg>
