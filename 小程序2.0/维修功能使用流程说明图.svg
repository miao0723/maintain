<svg width="100%" viewBox="0 0 680 862" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>电子维修2.0 维修功能使用流程</title>
  <desc>从小程序入口到评价的完整维修使用流程：进入小程序、填写报修单、提交订单、后台报价、确认报价、维修处理、查看进度、维修完成、确认并评价，底部为订单状态流转。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#185FA5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="60" y="44" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">电子维修2.0 · 维修功能使用流程</text>
  <text x="60" y="64" font-family="sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">客户从报修到评价的完整操作路径</text>

  <rect x="60" y="80" width="14" height="14" rx="3" fill="#185FA5"/>
  <text x="80" y="91" font-family="sans-serif" font-size="11" fill="#5F5E5A">用户操作步骤</text>
  <rect x="200" y="80" width="14" height="14" rx="3" fill="#3B6D11"/>
  <text x="220" y="91" font-family="sans-serif" font-size="11" fill="#5F5E5A">订单完成 / 终态</text>
  <text x="360" y="91" font-family="sans-serif" font-size="11" fill="#5F5E5A">右侧标签区分「用户」与「后台」动作</text>

  <g>
    <rect x="60" y="118" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="149" r="16" fill="#185FA5"/>
    <text x="94" y="149" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">1</text>
    <text x="132" y="140" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">进入小程序</text>
    <text x="132" y="162" font-family="sans-serif" font-size="12" fill="#5F5E5A">从首页/维修Tab、AI故障自检、或「我的设备」任一入口进入</text>
    <text x="604" y="134" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">用户</text>
  </g>
  <line x1="340" y1="180" x2="340" y2="190" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="192" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="223" r="16" fill="#185FA5"/>
    <text x="94" y="223" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">2</text>
    <text x="132" y="214" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">填写报修单</text>
    <text x="132" y="236" font-family="sans-serif" font-size="12" fill="#5F5E5A">选择设备类型/品牌/型号，勾选故障项，支持自定义与故障图片上传</text>
    <text x="604" y="208" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">用户</text>
  </g>
  <line x1="340" y1="254" x2="340" y2="264" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="266" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="297" r="16" fill="#185FA5"/>
    <text x="94" y="297" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">3</text>
    <text x="132" y="288" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">提交订单</text>
    <text x="132" y="310" font-family="sans-serif" font-size="12" fill="#5F5E5A">选择服务方式（到店/上门）、填写地址，生成「待处理」订单</text>
    <text x="604" y="282" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">用户</text>
  </g>
  <line x1="340" y1="328" x2="340" y2="338" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="340" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="371" r="16" fill="#185FA5"/>
    <text x="94" y="371" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">4</text>
    <text x="132" y="362" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">后台报价</text>
    <text x="132" y="384" font-family="sans-serif" font-size="12" fill="#5F5E5A">管理员填报价金额与说明，上传报价文件，订单进入「待报价」</text>
    <text x="604" y="356" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">后台</text>
  </g>
  <line x1="340" y1="402" x2="340" y2="412" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="414" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="445" r="16" fill="#185FA5"/>
    <text x="94" y="445" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">5</text>
    <text x="132" y="436" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">确认报价</text>
    <text x="132" y="458" font-family="sans-serif" font-size="12" fill="#5F5E5A">查看报价后接受或拒绝；拒绝可填原因，管理员重新报价</text>
    <text x="604" y="430" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">用户</text>
  </g>
  <line x1="340" y1="476" x2="340" y2="486" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="488" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="519" r="16" fill="#185FA5"/>
    <text x="94" y="519" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">6</text>
    <text x="132" y="510" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">维修处理</text>
    <text x="132" y="532" font-family="sans-serif" font-size="12" fill="#5F5E5A">确认后开始维修，工程师上传进度图片与视频，订单进入「维修中」</text>
    <text x="604" y="504" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">后台</text>
  </g>
  <line x1="340" y1="550" x2="340" y2="560" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="562" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="593" r="16" fill="#185FA5"/>
    <text x="94" y="593" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">7</text>
    <text x="132" y="584" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">查看维修进度</text>
    <text x="132" y="606" font-family="sans-serif" font-size="12" fill="#5F5E5A">随时查看进度图视频，可发起进度申请与咨询</text>
    <text x="604" y="578" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">用户</text>
  </g>
  <line x1="340" y1="624" x2="340" y2="634" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="636" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="667" r="16" fill="#185FA5"/>
    <text x="94" y="667" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">8</text>
    <text x="132" y="658" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">维修完成</text>
    <text x="132" y="680" font-family="sans-serif" font-size="12" fill="#5F5E5A">工程师完成维修并核算实际费用，订单转为「已完成」</text>
    <text x="604" y="652" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">后台</text>
  </g>
  <line x1="340" y1="698" x2="340" y2="708" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="60" y="710" width="560" height="62" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <circle cx="94" cy="741" r="16" fill="#185FA5"/>
    <text x="94" y="741" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#ffffff">9</text>
    <text x="132" y="732" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">确认并评价</text>
    <text x="132" y="754" font-family="sans-serif" font-size="12" fill="#5F5E5A">用户确认完成并提交星级与文字评价，流程结束</text>
    <text x="604" y="726" text-anchor="end" font-family="sans-serif" font-size="11" fill="#5F5E5A">用户</text>
  </g>

  <text x="80" y="800" font-family="sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">订单状态流转</text>
  <g>
    <rect x="80" y="812" width="80" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="120" y="827" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">待处理</text>
  </g>
  <line x1="160" y1="827" x2="168" y2="827" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="168" y="812" width="80" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="208" y="827" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">待报价</text>
  </g>
  <line x1="248" y1="827" x2="256" y2="827" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="256" y="812" width="80" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="296" y="827" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">已确认</text>
  </g>
  <line x1="336" y1="827" x2="344" y2="827" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <g>
    <rect x="344" y="812" width="80" height="30" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="384" y="827" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#0C447C">维修中</text>
  </g>
  <line x1="424" y1="827" x2="432" y2="827" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <g>
    <rect x="432" y="812" width="80" height="30" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="472" y="827" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#27500A">已完成</text>
  </g>
  <line x1="512" y1="827" x2="520" y2="827" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <g>
    <rect x="520" y="812" width="80" height="30" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
    <text x="560" y="827" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="11" fill="#27500A">已评价</text>
  </g>
</svg>
