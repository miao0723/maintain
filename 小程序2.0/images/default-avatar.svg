<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#436f95"/>
      <stop offset="1" stop-color="#6a9abb"/>
    </linearGradient>
    <clipPath id="circ">
      <circle cx="120" cy="120" r="120"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circ)">
    <rect width="240" height="240" fill="url(#bg)"/>
    <!-- 用户人像（白色） -->
    <circle cx="120" cy="90" r="40" fill="#ffffff"/>
    <path d="M42 202 C42 150 74 126 120 126 C166 126 198 150 198 202 Z" fill="#ffffff"/>
    <!-- 齿轮徽标（琥珀色，表示“待维修/需要服务”） -->
    <g transform="translate(182,176)">
      <g fill="#F5A623">
        <rect x="-7" y="-34" width="14" height="16" rx="3"/>
        <rect x="-7" y="-34" width="14" height="16" rx="3" transform="rotate(45)"/>
        <rect x="-7" y="-34" width="14" height="16" rx="3" transform="rotate(90)"/>
        <rect x="-7" y="-34" width="14" height="16" rx="3" transform="rotate(135)"/>
        <rect x="-7" y="-34" width="14" height="16" rx="3" transform="rotate(180)"/>
        <rect x="-7" y="-34" width="14" height="16" rx="3" transform="rotate(225)"/>
        <rect x="-7" y="-34" width="14" height="16" rx="3" transform="rotate(270)"/>
        <rect x="-7" y="-34" width="14" height="16" rx="3" transform="rotate(315)"/>
      </g>
      <circle r="24" fill="#F5A623"/>
      <circle r="11" fill="#436f95"/>
    </g>
  </g>
</svg>
