<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主渐变背景 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <!-- 头部渐变 -->
    <linearGradient id="headGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f9ff;stop-opacity:1" />
    </linearGradient>

    <!-- 眼睛渐变 -->
    <linearGradient id="eyeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>

    <!-- 光晕效果 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0" />
    </radialGradient>

    <!-- 阴影效果 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#764ba2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 光晕背景 -->
  <circle cx="100" cy="100" r="90" fill="url(#glow)" opacity="0.6"/>

  <!-- 主体圆 -->
  <circle cx="100" cy="100" r="80" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- 机器人头部 -->
  <rect x="45" y="50" width="110" height="85" rx="25" ry="25" fill="url(#headGradient)" filter="url(#shadow)"/>

  <!-- 天线 -->
  <line x1="100" y1="50" x2="100" y2="30" stroke="#764ba2" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="26" r="8" fill="#764ba2"/>

  <!-- 左眼 -->
  <circle cx="75" cy="85" r="12" fill="url(#eyeGradient)"/>
  <circle cx="78" cy="82" r="4" fill="white" opacity="0.8"/>

  <!-- 右眼 -->
  <circle cx="125" cy="85" r="12" fill="url(#eyeGradient)"/>
  <circle cx="128" cy="82" r="4" fill="white" opacity="0.8"/>

  <!-- 微笑 -->
  <path d="M 75 110 Q 100 125 125 110" stroke="#667eea" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- 腮红 -->
  <ellipse cx="65" cy="105" rx="8" ry="5" fill="#ff6b9d" opacity="0.3"/>
  <ellipse cx="135" cy="105" rx="8" ry="5" fill="#ff6b9d" opacity="0.3"/>

  <!-- 身体 -->
  <rect x="70" y="135" width="60" height="35" rx="10" ry="10" fill="url(#headGradient)" filter="url(#shadow)"/>

  <!-- 身体装饰 -->
  <circle cx="100" cy="152" r="8" fill="url(#bgGradient)"/>

  <!-- 手臂 -->
  <rect x="40" y="145" width="25" height="8" rx="4" ry="4" fill="url(#bgGradient)" transform="rotate(-20 52.5 149)"/>
  <rect x="135" y="145" width="25" height="8" rx="4" ry="4" fill="url(#bgGradient)" transform="rotate(20 147.5 149)"/>
</svg>