# 后台管理前端容器内部的 Nginx 配置
# 静态资源 + 本机直连 8081 时的 API 反代。
# 经 443 网关访问时走网关转发，不会经过这里的反代。
# 容器名解析用 resolver 动态生效，防止网关容器重建换 IP 后 502。
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # ---------- API 反代到统一网关（同源转发，避免跨域）----------
    # 网关 80 端口是 301 跳转，必须走 443；SNI/Host 用网关证书域名
    location ^~ /api/ {
        set $gateway https://nginx;
        proxy_pass $gateway;
        proxy_ssl_server_name on;
        proxy_ssl_name zych.net.cn;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host zych.net.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        client_max_body_size 100m;
    }

    # ---------- 共享上传目录（图片等静态资源同源访问）----------
    location ^~ /uploads/ {
        set $gateway https://nginx;
        proxy_pass $gateway;
        proxy_ssl_server_name on;
        proxy_ssl_name zych.net.cn;
        proxy_ssl_verify off;
        proxy_set_header Host zych.net.cn;
        expires 7d;
    }

    location ^~ /miniprogram-uploads/ {
        set $gateway https://nginx;
        proxy_pass $gateway;
        proxy_ssl_server_name on;
        proxy_ssl_name zych.net.cn;
        proxy_ssl_verify off;
        proxy_set_header Host zych.net.cn;
        expires 7d;
    }

    # ---------- 回收综合服务平台（SPA 子路径整体转发，8081 直连时可用）----------
    location ^~ /recycle-admin/ {
        set $gateway https://nginx;
        proxy_pass $gateway;
        proxy_ssl_server_name on;
        proxy_ssl_name zych.net.cn;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host zych.net.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # 静态资源长缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
