# ============================================================
# 统一入口网关
#   /            -> 后台管理前端 (frontend-web 容器, Vue3 SPA)
#   /api/        -> 后台管理后端 (php 容器, ThinkPHP)
#   /mp-api/     -> 小程序后端   (miniprogram-backend 容器, Express)
#   /ws/chat     -> 小程序后端 WebSocket
#   /uploads/    -> 共享上传目录（小程序与后台共用）
# ============================================================

# 后台管理后端（PHP-FPM）
upstream php_backend {
    server php:9000;
}

# 后台管理前端（静态 SPA）
upstream web_admin {
    server frontend-web:80;
}

# 小程序后端（Node.js）
upstream mp_backend {
    server miniprogram-backend:3001;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.html index.php;

    charset utf-8;

    # 文件上传大小限制 - 支持最大 100MB
    client_max_body_size 100m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    # ---------- 后台管理系统 API（ThinkPHP） ----------
    location /api {
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    # ---------- 小程序后端 API（Express） ----------
    # 小程序内可直连 http://<host>:3001/api，也可经网关使用 /mp-api
    location /mp-api/ {
        proxy_pass http://mp_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ---------- 小程序 WebSocket 聊天 ----------
    location /ws/chat {
        proxy_pass http://mp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 小程序后端健康检查 ----------
    location = /mp-health {
        proxy_pass http://mp_backend/health;
        proxy_set_header Host $host;
    }

    # ---------- 共享上传目录 ----------
    location /uploads/ {
        alias /var/www/html/miniprogram-uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    location /miniprogram-uploads/ {
        alias /var/www/html/miniprogram-uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ---------- PHP 入口 ----------
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # Ensure request body is passed
        fastcgi_pass_request_body on;
        fastcgi_pass_request_headers on;

        # 增加超时配置以支持长时间运行的请求（如 AI 调用）
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # ---------- 后台管理前端 SPA（放在最后作为兜底） ----------
    location / {
        proxy_pass http://web_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
