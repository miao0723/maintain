# ============================================================
# 统一入口网关
#   /            -> 后台管理前端 (frontend-web 容器, Vue3 SPA)
#   /api/        -> 后台管理后端 (php 容器, ThinkPHP)
#   /mp-api/     -> 小程序后端   (miniprogram-backend 容器, Express)
#   /ws/chat     -> 小程序后端 WebSocket
#   /uploads/    -> 共享上传目录（小程序与后台共用）
#
# SSL 证书挂载：docker-compose 将 ./nginx/ssl -> /etc/nginx/cert/
#   证书: /etc/nginx/cert/zych.net.cn.pem
#   私钥: /etc/nginx/cert/zych.net.cn.key
# ============================================================

# 后台管理后端（PHP-FPM）
upstream php_backend {
    server php:9000;
}

# 后台管理前端（静态 SPA）
upstream web_admin {
    server frontend-web:80;
}

# 小程序后端（Node.js）
upstream mp_backend {
    server miniprogram-backend:3001;
}

# ============================================================
# HTTP -> HTTPS 重定向
# ============================================================
server {
    # 纯 HTTP 端口，只用于 301 跳转到 HTTPS
    # （nginx 不能在同一个端口上同时处理 HTTP 与 TLS，因此跳转服务单独占用 80）
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 续签校验
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html/public;
    }

    # 其余请求一律 301 到 HTTPS（443 为 HTTPS 标准端口，无需带端口号）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# HTTPS 主服务器
# ============================================================
server {
    listen 443 ssl http2;
    server_name zych.net.cn;

    # SSL 证书（容器内路径，对应宿主机 ./nginx/ssl/）
    ssl_certificate     /etc/nginx/cert/zych.net.cn.pem;
    ssl_certificate_key /etc/nginx/cert/zych.net.cn.key;

    # SSL 安全配置（Mozilla Intermediate）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 隐藏 nginx 版本号
    server_tokens off;

    root /var/www/html/public;
    index index.html index.php;

    charset utf-8;

    # 基础性能优化
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 文件上传大小限制 - 支持最大 100MB
    client_max_body_size 100m;
    client_body_timeout 300s;
    proxy_read_timeout 300s;

    # ---------- Gzip 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/x-javascript
        image/svg+xml
        application/atom+xml;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ---------- 后台管理系统 API（ThinkPHP）----------
    # 使用 ^~ 精确前缀匹配，避免意外匹配 /api-xxx 等路径
    location ^~ /api/ {
        # 尝试静态文件 -> 目录 -> ThinkPHP 入口
        # 必须通过 s=$uri 把原始路径传给 ThinkPHP（其 var_pathinfo=s），
        # 否则 ThinkPHP 拿不到 pathinfo，所有 /api 请求都会落到默认 Index/index
        try_files $uri $uri/ /index.php?s=$uri&$query_string;
    }

    # ---------- 小程序后端 API（Express）----------
    # 兼容：若前端将 baseUrl 填为网关 /mp-api 又拼接了 /api 前缀，
    #       则剥离重复的 /api，正常转发到后端 /api 路由
    location /mp-api/api/ {
        proxy_pass http://mp_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location /mp-api/ {
        proxy_pass http://mp_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # 禁止缓存 API 响应
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---------- 小程序 WebSocket 聊天 ----------
    location /ws/chat {
        proxy_pass http://mp_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 小程序后端健康检查 ----------
    location = /mp-health {
        proxy_pass http://mp_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 共享上传目录 ----------
    location /uploads/ {
        alias /var/www/html/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        # 禁止对上传目录执行脚本
        location ~* \.(php|phtml|pht|php3|php4|php5|php7|php8|inc)$ {
            deny all;
        }
    }

    location /miniprogram-uploads/ {
        alias /var/www/html/miniprogram-uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        # 禁止对上传目录执行脚本
        location ~* \.(php|phtml|pht|php3|php4|php5|php7|php8|inc)$ {
            deny all;
        }
    }

    # ---------- PHP 入口 (FastCGI) ----------
    location ~ \.php$ {
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # 传递请求体和头
        fastcgi_pass_request_body on;
        fastcgi_pass_request_headers on;

        # 增加超时配置以支持长时间运行的请求（如 AI 调用）
        fastcgi_connect_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_read_timeout 300s;
    }

    # ---------- 禁止访问隐藏文件 ----------
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ---------- 后台管理前端 SPA（最低优先级作为兜底）----------
    location / {
        proxy_pass http://web_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 24k;

        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- 自定义错误页面 ----------
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }

    # ---------- 日志 ----------
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;
}
